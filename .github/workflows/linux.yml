name: Ubuntu Linux runtime
permissions:
  contents: read
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  ubuntu:
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential cmake clang libclang-dev libssl-dev pkg-config perl nodejs npm rustup python3 curl ca-certificates shellcheck
          rustup toolchain install nightly-2025-09-01 --profile minimal
      - name: Installer tests
        run: |
          python3 -m unittest discover -s tests -v
          shellcheck install.sh scripts/*.sh
      - name: Build, Rust tests and real HTTP smoke test
        run: bash scripts/build-runtime.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ubuntu-26.04-amd64-runtime
          path: build/runtime/
