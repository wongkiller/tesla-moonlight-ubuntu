Section "ServerFlags"
    Option "AutoAddDevices" "false"
    Option "AutoEnableDevices" "false"
    Option "DontVTSwitch" "true"
    Option "AllowMouseOpenFail" "true"
    Option "PciForceNone" "true"
EndSection
Section "Device"
    Identifier "TeslaDummy"
    Driver "dummy"
    VideoRam 131072
EndSection
Section "Monitor"
    Identifier "TeslaMonitor"
    Option "ReducedBlanking" "true"
    HorizSync 5.0-300.0
    VertRefresh 5.0-240.0
    Modeline "1600x900" 99.264 1600 1648 1680 1760 900 903 908 940 +HSync -VSync
    Modeline "1600x1200" 130.944 1600 1648 1680 1760 1200 1203 1208 1240 +HSync -VSync
    Modeline "1920x1080" 139.776 1920 1968 2000 2080 1080 1083 1088 1120 +HSync -VSync
EndSection
Section "Screen"
    Identifier "TeslaScreen"
    Device "TeslaDummy"
    Monitor "TeslaMonitor"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Modes "1600x900" "1600x1200" "1920x1080"
        Virtual 3840 2160
    EndSubSection
EndSection
